name: retention

# Keeps the newest 20 workflow runs of this repository (never fewer than 5) and deletes the older completed ones;
# deleting a run deletes its logs and artifacts. Nobody has to start it or switch it on: it deletes by default on every
# trigger, after every finished ci run, once a day as a backstop, and on request. It touches no branch, tag, release or
# file of the repository: scripts/RunRetention.cs calls the GitHub API for the list of runs and for the deletion of one
# run only, and scripts/RetentionShape.cs pins this file (its triggers, its permissions, its steps).
# - workflow_run: a run of the `ci` workflow that finished, on any branch or pull request, starts a retention run, so
#   the history is trimmed after each ci run. GitHub starts a workflow_run workflow only from the file on the default
#   branch, so this trigger is live once this file is on main, and a change to this file on another branch is not
#   exercised until it is merged. The run uses the default branch (the checkout takes no ref) and reads no field of the
#   event, so the branch or the pull request that started the ci run reaches nothing here.
# - schedule: the same trim once a day, which also covers a ci run that ended without starting this workflow.
# - workflow_dispatch: a run on request. `keep` is how many of the newest runs to keep (at least 5), and `dry_run`
#   is an explicit opt-in that only lists what would be deleted. The other two triggers have no input, so they use the
#   defaults (keep 20, delete).
# The newest `keep` are counted over the runs of all workflows together (ci and any other), except the runs of this
# workflow: it starts once for each finished ci run, so counting its runs would leave about ten ci runs in the newest
# twenty. Its own runs are trimmed on their own to the newest 5, and the running one is never deleted.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the runs that would be deleted, and delete nothing
        type: boolean
        default: false
      keep:
        description: How many of the newest runs to keep (at least 5)
        type: number
        default: 20

permissions:
  actions: write
  contents: read

# Overlapping runs queue one after the other instead of racing for the same deletions; none is cancelled.
concurrency:
  group: retention
  cancel-in-progress: false

jobs:
  retention:
    name: retention
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check that the retention script refuses what it is meant to refuse
        run: dotnet run scripts/RunRetention.cs -- self-test
      - name: Delete the runs beyond the newest ones, or only list them in a dry run
        env:
          GH_TOKEN: ${{ github.token }}
          RETENTION_KEEP: ${{ inputs.keep }}
          RETENTION_DRY_RUN: ${{ inputs.dry_run }}
        run: dotnet run scripts/RunRetention.cs -- run
