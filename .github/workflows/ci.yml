name: ci

# A pull request is built by its own pull_request run, so a push builds only the long-lived branches (and the audit
# branches, which are pushed without a pull request to get a run); a branch with a pull request is not built twice.
on:
  push:
    branches:
      - main
      - wip-snapshot
      - "orm-audit/**"
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # The pipeline runs in four ordered stages, each a set of jobs that need the one before: 1 static (every guard and
  # self-test that needs no server, and a strict build), 2 test (one leg per .NET runtime), 3 package (pack and the
  # consumer matrix, and the NativeAOT smoke legs) and 4 demo (the two demos). A stage starts only when the one before
  # it passed, so a broken gate or build stops the run early; the jobs of one stage run in parallel. The test legs
  # build again instead of taking the build of stage 1 (one more build in the run, and no artifact hand-off to go
  # wrong). scripts/StageShape.cs pins the stages, the needs and the steps each stage must keep.
  static:
    name: 1 static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Print the SDK and the runtimes this stage runs on
        run: dotnet --info
      - name: Check that the skip gate refuses what it is meant to refuse
        run: dotnet run scripts/SkipGate.cs -- self-test
      - name: Check that the workflow-shape guard refuses what it is meant to refuse
        run: dotnet run scripts/WorkflowShape.cs -- self-test
      - name: Check that this workflow keeps the compose step, the variable and the gate
        run: dotnet run scripts/WorkflowShape.cs -- check
      - name: Check that the step guard refuses what it is meant to refuse
        run: dotnet run scripts/StepShape.cs -- self-test
      - name: Check that the test steps keep their thread cap and the zone step and its gate stand
        run: dotnet run scripts/StepShape.cs -- check
      - name: Check that the matrix guard refuses what it is meant to refuse
        run: dotnet run scripts/MatrixShape.cs -- self-test
      - name: Check that the test and AOT jobs keep their .NET 10 and .NET 11 legs
        run: dotnet run scripts/MatrixShape.cs -- check
      - name: Check that the compose guard refuses what it is meant to refuse
        run: dotnet run scripts/ComposeCoherence.cs -- self-test
      - name: Check that the image major and the host ports agree in the compose files, ci.yml and the READMEs
        run: dotnet run scripts/ComposeCoherence.cs -- check
      - name: Check that the stage guard refuses what it is meant to refuse
        run: dotnet run scripts/StageShape.cs -- self-test
      - name: Check that the jobs keep their stages, their needs and the steps of each stage
        run: dotnet run scripts/StageShape.cs -- check
      - name: Check that the retention guard refuses what it is meant to refuse
        run: dotnet run scripts/RetentionShape.cs -- self-test
      - name: Check that the retention workflow keeps its narrow shape
        run: dotnet run scripts/RetentionShape.cs -- check
      - name: Check that the run selection of the retention script keeps the newest runs and refuses a low limit
        run: dotnet run scripts/RunRetention.cs -- self-test
      - name: Build the solution in Release with every warning an error
        run: dotnet build Neemle.Orm.Lite.slnx -c Release -warnaserror

  # The tests run once per .NET runtime, each leg on its own runner with its own throwaway PostgreSQL. The test
  # project targets net10.0, so the .NET 11 leg builds it with the SDK 11 and lets the test host roll forward to the
  # newest installed runtime (DOTNET_ROLL_FORWARD=LatestMajor); the .NET 10 leg names the default policy (Minor), so a
  # runtime 11 that the runner image may carry is not used there. ORMLITE_EXPECT_DOTNET makes a test fail when the
  # test host runs on another major than the leg names (TestHostRuntimeTests). scripts/MatrixShape.cs guards this.
  test:
    name: 2 test (.NET ${{ matrix.dotnet }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet: 10.0.x
            roll-forward: Minor
          - dotnet: 11.0.x
            roll-forward: LatestMajor
    env:
      DOTNET_ROLL_FORWARD: ${{ matrix.roll-forward }}
      ORMLITE_EXPECT_DOTNET: ${{ matrix.dotnet }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Print the SDK and the runtimes this leg runs on
        run: dotnet --info
      - run: dotnet build Neemle.Orm.Lite.slnx -c Release
      - name: Start the throwaway PostgreSQL of tests/compose.yaml and wait until it is healthy
        run: docker compose -f tests/compose.yaml up -d --wait --wait-timeout 120
      - name: Log the image the moving PostgreSQL major tag resolved to, so a failing run names its image
        shell: bash
        run: |
          for image in $(docker compose -f tests/compose.yaml config --images); do
            docker image inspect "$image" --format '{{.RepoTags}} id={{.Id}} digests={{.RepoDigests}}'
          done
      # Each test project is run by its own step with its own TRX name: the TRX logger overwrites a file of the
      # same name, so two projects in one `dotnet test` of the solution would leave only the last TRX for the gate.
      - name: Run every test of the library, the PostgreSQL ones against that server, one at a time
        timeout-minutes: 15
        env:
          ORMLITE_TEST_POSTGRES: Host=127.0.0.1;Port=55433;Username=postgres
        run: >-
          dotnet test tests/Neemle.Orm.Lite.Tests/Neemle.Orm.Lite.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=detailed"
          --results-directory TestResults
          --blame-crash --blame-crash-dump-type mini
          --blame-hang-timeout 10m --blame-hang-dump-type mini
          -- xUnit.MaxParallelThreads=1
      - name: Fail on a skipped test that is not on the allow-list and on a PostgreSQL class that did not run
        run: >-
          dotnet run scripts/SkipGate.cs -- check TestResults/tests.trx tests/skip-allowlist.txt
          --require-postgres tests/skip-witness.txt
      - name: Run the data-literal tests again under a non-UTC time zone (guards the Local to UTC conversion)
        env:
          TZ: Pacific/Auckland
        run: >-
          dotnet test tests/Neemle.Orm.Lite.Tests/Neemle.Orm.Lite.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~DataLiteral&FullyQualifiedName!~Postgres"
          --logger "trx;LogFileName=zone.trx" --results-directory TestResults
          --blame-crash --blame-crash-dump-type mini
          --blame-hang-timeout 10m --blame-hang-dump-type mini
          -- xUnit.MaxParallelThreads=1
      - name: Fail when a data-literal witness class did not run and pass under that zone
        run: >-
          dotnet run scripts/SkipGate.cs -- check TestResults/zone.trx tests/zone-allowlist.txt
          --require-postgres tests/zone-witness.txt
      # The ports project references the Runtime and Sql assemblies only and runs a fake third provider on no server.
      - name: Run the tests of the ports project, which sees no provider and no driver
        timeout-minutes: 10
        run: >-
          dotnet test tests/Neemle.Orm.Lite.Ports.Tests/Neemle.Orm.Lite.Ports.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=ports.trx" --logger "console;verbosity=detailed"
          --results-directory TestResults
          --blame-crash --blame-crash-dump-type mini
          --blame-hang-timeout 5m --blame-hang-dump-type mini
          -- xUnit.MaxParallelThreads=1
      - name: Fail when a ports test skipped or a ports test class did not run and pass
        run: >-
          dotnet run scripts/SkipGate.cs -- check TestResults/ports.trx tests/ports-allowlist.txt
          --require-postgres tests/ports-witness.txt
      - name: Keep the TRX files and the crash and hang dumps of this leg
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.dotnet }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: 3 package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Pack the three packages into the local feed (nothing is published)
        run: dotnet pack Neemle.Orm.Lite.slnx -c Release -o artifacts -m:1
      - name: Check that the README guard refuses what it is meant to refuse
        run: dotnet run scripts/ReadmeCheck.cs -- self-test
      - name: Check the README wiring, the public files and that PackCheck still runs the README guard
        run: dotnet run scripts/ReadmeCheck.cs -- source
      - name: Check that the assembly version guard refuses what it is meant to refuse
        run: dotnet run scripts/PackVersions.cs -- self-test
      - name: Check the package entries and run the throwaway-consumer matrix
        run: dotnet run scripts/PackCheck.cs -- package artifacts
      - name: Check that the demo guard refuses the bypasses it is meant to refuse
        run: dotnet run scripts/PackCheck.cs -- demo-guard-self-test
      - name: Check that the demo consumes the package, not a project
        run: dotnet run scripts/PackCheck.cs -- demo-guard

  # The NativeAOT consumer is published once per .NET runtime. The shipped libraries stay net10.0 (a net11.0 consumer
  # references them as they are); only the consumer's target framework follows the leg (AotSmokeTfm of the project),
  # and the binary prints the runtime it was compiled for, which the last step compares with the leg.
  aot-smoke:
    name: 3 aot-smoke (.NET ${{ matrix.dotnet }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet: 10.0.x
            tfm: net10.0
          - dotnet: 11.0.x
            tfm: net11.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Print the SDK and the runtimes this leg runs on
        run: dotnet --info
      - name: Publish a NativeAOT consumer that renders a Where() over closure unaries, then run it
        shell: bash
        env:
          AOT_TFM: ${{ matrix.tfm }}
        run: |
          dotnet publish tests/AotSmoke -c Release -r linux-x64 -p:AotSmokeTfm=${{ matrix.tfm }} -o aot-out
          ./aot-out/AotSmoke | tee aot.log
          grep -qx 'aot smoke ok' aot.log
          grep -q "^aot runtime: ${AOT_TFM#net}" aot.log

  demo-sqlite:
    name: 4 demo-sqlite
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Pack the three packages into the local feed (nothing is published)
        run: dotnet pack Neemle.Orm.Lite.slnx -c Release -o artifacts -m:1
      - name: Run the demo on SQLite with no service and no setting
        shell: bash
        run: |
          dotnet run --project demo -c Release | tee demo.log
          grep -qx 'demo ok' demo.log

  demo-postgres:
    name: 4 demo-postgres
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OrmLite__Provider: postgres
      OrmLite__Host: 127.0.0.1
      OrmLite__Port: "55432"
      OrmLite__Username: postgres
      OrmLite__Database: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Start the throwaway PostgreSQL of demo/compose.yaml and wait until it is healthy
        run: docker compose -f demo/compose.yaml up -d --wait --wait-timeout 120
      - name: Pack the three packages into the local feed (nothing is published)
        run: dotnet pack Neemle.Orm.Lite.slnx -c Release -o artifacts -m:1
      - name: Run the demo, soft delete and history included, on a fresh PostgreSQL database, changing only the provider block
        shell: bash
        run: |
          dotnet build demo -c Release --no-incremental
          dotnet run --project demo -c Release --no-build | tee demo.log
          grep -qx 'demo ok' demo.log
