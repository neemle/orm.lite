name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Neemle.Orm.Lite.slnx -c Release
      - run: dotnet test Neemle.Orm.Lite.slnx -c Release --no-build

  package:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ORMLITE_DEMO_CONNECTION: Host=localhost;Port=5432;Username=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack into the local feed (nothing is published)
        run: dotnet pack src/Neemle.Orm.Lite/Neemle.Orm.Lite.csproj -c Release -o artifacts -m:1
      - name: Check the package entries and run the throwaway-consumer matrix
        run: dotnet run scripts/PackCheck.cs -- package artifacts
      - name: Check that the demo consumes the package, not a project
        run: dotnet run scripts/PackCheck.cs -- demo-guard
      - name: Run the demo against the PostgreSQL service
        shell: bash
        run: |
          dotnet run --project demo -c Release | tee demo.log
          grep -qx 'demo ok' demo.log
